<!--
KEYS AND DOORS — 1000 levels, gets harder each level.
Fullscreen maze. WASD/arrows. Matching key numbers on doors. R = restart level.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Keys and Doors</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #080a0f;
      color: #e8ecf4;
    }
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 16px;
      padding: 10px 14px;
      background: linear-gradient(180deg, #1a2233, #121820);
      border-bottom: 1px solid #3d4f6b;
    }
    .brand {
      font-weight: 800;
      font-size: 1.15rem;
      background: linear-gradient(90deg, #ffd166, #f4a261);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 600;
      color: #9eb0c8;
    }
    .stats strong { color: #ffd166; }
    .key-tray {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 10px;
      background: #0f1520;
      border: 1px solid #3d5068;
    }
    .key-tray .slots {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-width: 40vw;
      align-items: center;
    }
    .key-tray .slots em { color: #6b7d94; font-style: normal; font-weight: 400; }
    .key-chip {
      min-width: 26px;
      height: 26px;
      padding: 0 5px;
      border-radius: 7px;
      background: linear-gradient(145deg, #ffe066, #f4a261);
      color: #1a1208;
      font-weight: 800;
      font-size: 0.85rem;
      display: grid;
      place-items: center;
    }
    .progress-wrap {
      flex: 1;
      min-width: 120px;
      max-width: 280px;
      height: 8px;
      background: #0f1520;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #3d5068;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6ee7a0, #ffd166);
      transition: width 0.3s ease;
    }
    button {
      font: inherit;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      color: #0f1520;
      background: linear-gradient(180deg, #8ecae6, #5a9fc9);
    }
    button:active { transform: translateY(1px); }
    .canvas-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0e14;
      padding: 4px;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .bottom-bar {
      flex-shrink: 0;
      padding: 8px 14px 12px;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      color: #a8c4e0;
      background: #0f1218;
      border-top: 1px solid #2a3548;
    }
    .bottom-bar.win { color: #6ee7a0; }
    .bottom-bar.warn { color: #ffb347; }
  </style>
</head>
<body>
  <div id="app">
    <div class="top-bar">
      <span class="brand">Keys &amp; Doors</span>
      <div class="stats">
        <span>Level <strong id="levelNum">1</strong> / 1000</span>
        <span id="keyCount">2 keys</span>
        <div class="progress-wrap" title="Progress to level 1000">
          <div class="progress-fill" id="progressBar" style="width: 0.1%"></div>
        </div>
      </div>
      <div class="key-tray">
        <span>Keys</span>
        <div class="slots" id="inventory"><em>empty</em></div>
      </div>
      <button type="button" id="btnRestart">Restart (R)</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="c"></canvas>
    </div>
    <p class="bottom-bar" id="status">Reach the green exit!</p>
  </div>

  <script>
    (function () {
      const MAX_LEVEL = 1000;
      const STORAGE_KEY = "keysAndDoorsSave";

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const inventoryEl = document.getElementById("inventory");
      const levelNumEl = document.getElementById("levelNum");
      const keyCountEl = document.getElementById("keyCount");
      const progressBar = document.getElementById("progressBar");
      const btnRestart = document.getElementById("btnRestart");
      const canvasWrap = document.querySelector(".canvas-wrap");

      let COLS = 15;
      let ROWS = 11;
      let TILE = 40;
      let MAP = [];
      let LEVEL = null;

      const state = {
        levelIndex: 1,
        player: { c: 0, r: 0 },
        keysOnMap: [],
        doors: [],
        inventory: [],
        won: false,
        tick: 0,
        sparkles: [],
      };

      const PAL = {
        wallTop: "#2a3548",
        wallFace: "#1a2230",
        wallEdge: "#4a5d78",
        floorA: "#3d5a6e",
        floorB: "#345068",
        floorLine: "rgba(255,255,255,0.06)",
        torch: "rgba(255, 180, 80, 0.12)",
      };

      function mulberry32(seed) {
        return function () {
          let t = (seed += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /** One path, keys in left alcoves, doors on right — scales with level. */
      function generateLevel(level) {
        const rng = mulberry32(level * 7919 + 104729);
        const numKeys = Math.min(
          2 + Math.floor(level / 55) + (level > 400 ? 1 : 0),
          14
        );
        const extraRows = level > 300 ? 1 : 0;
        const extraCols = Math.min(Math.floor(level / 120), 10);
        const rows = 6 + numKeys * 2 + extraRows;
        const cols = 11 + Math.min(numKeys, 8) + extraCols;
        const doorC = cols - 2;
        const startC = cols - 2;
        const startR = rows - 2;

        const pathSet = new Set();
        const path = [];
        function add(c, r) {
          if (c < 1 || r < 1 || c >= cols - 1 || r >= rows - 1) return;
          const k = c + "," + r;
          if (pathSet.has(k)) return;
          pathSet.add(k);
          path.push([c, r]);
        }

        add(startC, startR);
        add(startC - 1, startR);
        add(doorC, startR);

        let spineR = startR;

        for (let i = 1; i <= numKeys; i++) {
          const alcoveR = spineR;
          const keyR = alcoveR - 1;
          const wobble = level > 100 ? Math.floor(rng() * 2) : 0;
          const westEnd = 2 + wobble;

          for (let c = doorC - 1; c >= westEnd; c--) add(c, alcoveR);
          add(westEnd, alcoveR);
          add(westEnd, keyR);
          const keyC = westEnd;
          for (let c = westEnd + 1; c <= doorC - 1; c++) add(c, keyR);
          add(doorC, keyR);

          spineR = keyR - 1;
          if (spineR >= 2) add(doorC, spineR);
        }

        while (spineR > 1) {
          add(doorC, spineR);
          spineR--;
        }
        add(doorC, 1);
        for (let c = doorC + 1; c <= startC; c++) add(c, 1);

        const keys = [];
        const doors = [];
        let ki = 1;
        spineR = startR;
        for (let i = 1; i <= numKeys; i++) {
          const alcoveR = spineR;
          const keyR = alcoveR - 1;
          const wobble = level > 100 ? Math.floor(rng() * 2) : 0;
          const keyC = 2 + wobble;
          keys.push({ c: keyC, r: keyR, n: ki });
          doors.push({ c: doorC, r: keyR, n: ki });
          ki++;
          spineR = keyR - 1;
        }

        const map = Array.from({ length: rows }, () => Array(cols).fill(0));
        for (const [c, r] of path) map[r][c] = 1;

        return {
          cols,
          rows,
          map,
          start: { c: startC, r: startR },
          goal: { c: startC, r: 1 },
          keys,
          doors,
          numKeys,
        };
      }

      function loadSave() {
        try {
          const n = parseInt(localStorage.getItem(STORAGE_KEY), 10);
          if (n >= 1 && n <= MAX_LEVEL) return n;
        } catch (_) {}
        return 1;
      }

      function saveProgress() {
        try {
          localStorage.setItem(STORAGE_KEY, String(state.levelIndex));
        } catch (_) {}
      }

      function tileCenter(c, r) {
        return { x: c * TILE + TILE / 2, y: r * TILE + TILE / 2 };
      }

      function resizeCanvas() {
        if (!LEVEL) return;
        const pad = 8;
        const w = canvasWrap.clientWidth - pad;
        const h = canvasWrap.clientHeight - pad;
        const tileW = Math.floor(w / COLS);
        const tileH = Math.floor(h / ROWS);
        TILE = Math.max(10, Math.min(tileW, tileH, 64));
        canvas.width = COLS * TILE;
        canvas.height = ROWS * TILE;
      }

      function applyLevelData(data) {
        COLS = data.cols;
        ROWS = data.rows;
        MAP = data.map;
        LEVEL = {
          start: data.start,
          goal: data.goal,
          keys: data.keys,
          doors: data.doors,
        };
        resizeCanvas();
      }

      function startLevel(levelIndex, keepWon) {
        state.levelIndex = Math.min(Math.max(1, levelIndex), MAX_LEVEL);
        const data = generateLevel(state.levelIndex);
        applyLevelData(data);
        state.player = { ...LEVEL.start };
        state.keysOnMap = LEVEL.keys.map((k) => ({ ...k }));
        state.doors = LEVEL.doors.map((d) => ({ ...d, open: false }));
        state.inventory = [];
        state.won = keepWon || false;
        state.sparkles = [];

        levelNumEl.textContent = String(state.levelIndex);
        keyCountEl.textContent =
          data.numKeys + " key" + (data.numKeys === 1 ? "" : "s");
        progressBar.style.width =
          ((state.levelIndex / MAX_LEVEL) * 100).toFixed(2) + "%";

        if (!keepWon) {
          setStatus("Reach the green exit!", "");
        }
        refreshInventory();
        saveProgress();
      }

      function restartCurrentLevel() {
        startLevel(state.levelIndex, false);
      }

      function setStatus(msg, cls) {
        statusEl.textContent = msg;
        statusEl.className = "bottom-bar" + (cls ? " " + cls : "");
      }

      function refreshInventory() {
        if (state.inventory.length === 0) {
          inventoryEl.innerHTML = "<em>empty</em>";
          return;
        }
        inventoryEl.innerHTML = state.inventory
          .slice()
          .sort((a, b) => a - b)
          .map((n) => `<span class="key-chip">${n}</span>`)
          .join("");
      }

      function inBounds(c, r) {
        return c >= 0 && r >= 0 && c < COLS && r < ROWS;
      }

      function isFloor(c, r) {
        return inBounds(c, r) && MAP[r][c] === 1;
      }

      function keyHere(c, r) {
        return state.keysOnMap.find((k) => k.c === c && k.r === r);
      }

      function closedDoor(c, r) {
        return state.doors.find((d) => d.c === c && d.r === r && !d.open);
      }

      function useKey(n) {
        const i = state.inventory.indexOf(n);
        if (i === -1) return false;
        state.inventory.splice(i, 1);
        return true;
      }

      function pickUpKey() {
        const k = keyHere(state.player.c, state.player.r);
        if (!k) return;
        state.inventory.push(k.n);
        state.keysOnMap = state.keysOnMap.filter((x) => x !== k);
        setStatus("Got key " + k.n + "!", "");
        refreshInventory();
        spawnSparkles(state.player.c, state.player.r, "#ffd166", 8);
      }

      function advanceLevel() {
        if (state.levelIndex >= MAX_LEVEL) {
          state.won = true;
          setStatus("You beat all 1000 levels! Press R to play level 1000 again.", "win");
          spawnSparkles(LEVEL.goal.c, LEVEL.goal.r, "#6ee7a0", 40);
          return;
        }
        const next = state.levelIndex + 1;
        setStatus("Level " + state.levelIndex + " clear! Loading " + next + "…", "win");
        spawnSparkles(LEVEL.goal.c, LEVEL.goal.r, "#6ee7a0", 30);
        setTimeout(function () {
          startLevel(next, false);
          setStatus("Level " + next + " — go!", "");
        }, 900);
      }

      function tryWin() {
        const { c, r } = state.player;
        if (c !== LEVEL.goal.c || r !== LEVEL.goal.r) return;
        const done =
          state.keysOnMap.length === 0 &&
          state.doors.every((d) => d.open);
        if (!done) {
          setStatus("Get every key and open every door first!", "warn");
          return;
        }
        state.won = true;
        advanceLevel();
      }

      function tryMove(dc, dr) {
        if (state.won) return;
        const nc = state.player.c + dc;
        const nr = state.player.r + dr;
        if (!isFloor(nc, nr)) return;

        const door = closedDoor(nc, nr);
        if (door) {
          if (!useKey(door.n)) {
            setStatus("Need key " + door.n + "!", "warn");
            return;
          }
          door.open = true;
          state.player.c = nc;
          state.player.r = nr;
          setStatus("Door " + door.n + " opened!", "");
          refreshInventory();
          spawnSparkles(nc, nr, "#c77dff", 12);
          pickUpKey();
          tryWin();
          return;
        }

        state.player.c = nc;
        state.player.r = nr;
        pickUpKey();
        tryWin();
      }

      function spawnSparkles(c, r, color, n) {
        const { x, y } = tileCenter(c, r);
        for (let i = 0; i < n; i++) {
          state.sparkles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3 - 1,
            life: 30 + Math.random() * 20,
            color,
          });
        }
      }

      function fontSize(ratio) {
        return Math.max(8, Math.floor(TILE * ratio));
      }

      function drawWall(x, y) {
        ctx.fillStyle = PAL.wallFace;
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = PAL.wallTop;
        ctx.fillRect(x, y, TILE, TILE * 0.35);
        ctx.strokeStyle = PAL.wallEdge;
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
      }

      function drawFloor(x, y, c, r) {
        const alt = (c + r) % 2 === 0;
        ctx.fillStyle = alt ? PAL.floorA : PAL.floorB;
        ctx.fillRect(x, y, TILE, TILE);
        if (TILE >= 16) {
          ctx.strokeStyle = PAL.floorLine;
          ctx.beginPath();
          ctx.moveTo(x, y + TILE);
          ctx.lineTo(x + TILE, y + TILE);
          ctx.lineTo(x + TILE, y);
          ctx.stroke();
        }
      }

      function drawLabel(cx, cy, n, bg, fg) {
        const R = Math.max(6, TILE * 0.22);
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = fg;
        ctx.font = "800 " + fontSize(0.34) + "px system-ui,sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(n), cx, cy + 1);
      }

      function drawKey(c, r, n) {
        if (TILE < 14) {
          drawLabel(c * TILE + TILE / 2, r * TILE + TILE / 2, n, "#e9c46a", "#1a1a1a");
          return;
        }
        const x = c * TILE;
        const y = r * TILE;
        const cx = x + TILE / 2;
        const cy = y + TILE / 2;
        const s = TILE / 40;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(s, s);
        ctx.rotate(-0.35);
        ctx.fillStyle = "#e9c46a";
        ctx.beginPath();
        ctx.arc(-5, 0, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f4d35e";
        ctx.fillRect(2, -3, 14, 6);
        ctx.fillRect(14, -7, 4, 14);
        ctx.restore();
        drawLabel(cx, cy - TILE * 0.15, n, "#c45c26", "#fff");
      }

      function drawDoor(c, r, n, open) {
        const x = c * TILE;
        const y = r * TILE;
        const pad = Math.max(2, TILE * 0.12);
        if (open) {
          ctx.fillStyle = "#2d6a4f";
          ctx.fillRect(x + pad, y + pad, TILE - pad * 2, TILE - pad * 2);
          return;
        }
        if (TILE < 14) {
          drawLabel(x + TILE / 2, y + TILE / 2, n, "#6a4c93", "#fff8e7");
          return;
        }
        ctx.fillStyle = "#5c4033";
        ctx.fillRect(x + pad, y + pad, TILE - pad * 2, TILE - pad * 2);
        ctx.fillStyle = "#3d2817";
        ctx.fillRect(x + pad + 4, y + pad + 4, TILE - pad * 2 - 8, TILE - pad * 2 - 8);
        drawLabel(x + TILE / 2, y + TILE / 2, n, "#6a4c93", "#fff8e7");
      }

      function drawGoal(c, r) {
        const { x, y } = tileCenter(c, r);
        const pulse = 1 + Math.sin(state.tick * 0.08) * 0.08;
        const R = Math.max(8, TILE * 0.35);
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(pulse, pulse);
        ctx.fillStyle = "#2d6a4f";
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
          const rad = i % 2 === 0 ? R : R * 0.45;
          const px = Math.cos(a) * rad;
          const py = Math.sin(a) * rad;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#95ff9a";
        ctx.lineWidth = Math.max(1, TILE / 20);
        ctx.stroke();
        ctx.restore();
      }

      function drawPlayer(c, r) {
        const { x, y } = tileCenter(c, r);
        const bob = Math.sin(state.tick * 0.12) * Math.min(2, TILE * 0.05);
        const R = Math.max(6, TILE * 0.28);
        ctx.save();
        ctx.translate(x, y + bob);
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.beginPath();
        ctx.ellipse(0, R * 0.5, R * 0.7, R * 0.25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffd166";
        ctx.beginPath();
        ctx.moveTo(0, -R);
        ctx.lineTo(R * 0.85, R * 0.4);
        ctx.lineTo(0, R);
        ctx.lineTo(-R * 0.85, R * 0.4);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#e9a319";
        ctx.lineWidth = Math.max(1, TILE / 18);
        ctx.stroke();
        if (TILE >= 18) {
          ctx.fillStyle = "#1a1a2e";
          ctx.beginPath();
          ctx.arc(-R * 0.25, -R * 0.2, R * 0.15, 0, Math.PI * 2);
          ctx.arc(R * 0.25, -R * 0.2, R * 0.15, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawSparkles() {
        for (let i = state.sparkles.length - 1; i >= 0; i--) {
          const s = state.sparkles[i];
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 0.05;
          s.life -= 1;
          if (s.life <= 0) {
            state.sparkles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = s.life / 50;
          ctx.fillStyle = s.color;
          ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
          ctx.globalAlpha = 1;
        }
      }

      function draw() {
        state.tick++;
        ctx.fillStyle = "#0a0e14";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const offX = 0;
        const offY = 0;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const x = offX + c * TILE;
            const y = offY + r * TILE;
            if (MAP[r][c]) drawFloor(x, y, c, r);
            else drawWall(x, y);
          }
        }

        if (TILE >= 20 && LEVEL.start.r < ROWS) {
          const sc = LEVEL.start.c;
          const sr = LEVEL.start.r;
          const x = sc * TILE + TILE / 2;
          const y = sr * TILE + TILE / 2;
          const g = ctx.createRadialGradient(x, y, 0, x, y, TILE * 1.5);
          g.addColorStop(0, PAL.torch);
          g.addColorStop(1, "transparent");
          ctx.fillStyle = g;
          ctx.fillRect(sc * TILE - TILE, sr * TILE - TILE, TILE * 3, TILE * 3);
        }

        drawGoal(LEVEL.goal.c, LEVEL.goal.r);
        for (const d of state.doors) drawDoor(d.c, d.r, d.n, d.open);
        for (const k of state.keysOnMap) drawKey(k.c, k.r, k.n);
        drawPlayer(state.player.c, state.player.r);
        drawSparkles();
      }

      function onKeyDown(e) {
        if (e.key === "r" || e.key === "R") {
          restartCurrentLevel();
          e.preventDefault();
          return;
        }
        if (state.won || e.repeat) return;
        const map = {
          ArrowUp: [0, -1],
          w: [0, -1],
          W: [0, -1],
          ArrowDown: [0, 1],
          s: [0, 1],
          S: [0, 1],
          ArrowLeft: [-1, 0],
          a: [-1, 0],
          A: [-1, 0],
          ArrowRight: [1, 0],
          d: [1, 0],
          D: [1, 0],
        };
        const d = map[e.key];
        if (d) tryMove(d[0], d[1]);
      }

      btnRestart.addEventListener("click", restartCurrentLevel);
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("resize", function () {
        resizeCanvas();
      });

      startLevel(loadSave(), false);

      function loop() {
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
 s  </script>
</body>
</html>
