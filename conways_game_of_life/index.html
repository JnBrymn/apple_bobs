<!--
PLAN:
- Build a classic 2D Conway's Game of Life (B3/S23).
- Let player paint cells by clicking/dragging.
- Include controls: run/pause, step, clear, random, speed, grid size, wrap edges.
- Show generation count and live cell count.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conway's Game of Life</title>
  <style>
    :root {
      --bg: #101217;
      --panel: #1d2330;
      --panel-border: #2a3345;
      --text: #d5deee;
      --muted: #93a3bc;
      --alive: #78f08d;
      --alive-glow: #3dcf6f;
      --dead: #0f1520;
      --accent: #66a8ff;
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1c2433, var(--bg) 60%);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: min(980px, 100%);
      display: grid;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 14px;
    }

    h1 {
      font-size: clamp(1.4rem, 2.2vw, 2rem);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      align-items: end;
    }

    button,
    select,
    input[type="range"] {
      width: 100%;
      font-size: 0.95rem;
      border-radius: 10px;
      border: 1px solid #3a4861;
      background: #29354b;
      color: var(--text);
      padding: 9px 10px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.05s ease, filter 0.15s ease;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      background: #2d5fa4;
      border-color: #5d8fd4;
    }

    button.warn {
      background: #7f3442;
      border-color: #b84e64;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .statline {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .statline strong {
      color: var(--text);
      font-size: 1rem;
    }

    canvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: var(--dead);
      image-rendering: pixelated;
      cursor: crosshair;
      touch-action: none;
    }

    .help {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Conway's Game of Life</h1>
      <p class="subtitle">Classic rules: cells are born with 3 neighbors and survive with 2 or 3.</p>
    </section>

    <section class="panel controls">
      <button id="runBtn" class="primary">Run</button>
      <button id="stepBtn">Step</button>
      <button id="clearBtn" class="warn">Clear</button>
      <button id="randomBtn">Randomize</button>

      <div>
        <label for="speedRange">Speed</label>
        <input id="speedRange" type="range" min="1" max="30" value="10">
      </div>

      <div>
        <label for="sizeSelect">Grid Size</label>
        <select id="sizeSelect">
          <option value="25">25 x 25</option>
          <option value="40" selected>40 x 40</option>
          <option value="60">60 x 60</option>
          <option value="80">80 x 80</option>
        </select>
      </div>

      <div>
        <label for="wrapSelect">Edge Mode</label>
        <select id="wrapSelect">
          <option value="on" selected>Wrap Around</option>
          <option value="off">Hard Edges</option>
        </select>
      </div>
    </section>

    <section class="panel statline">
      <div>Generation: <strong id="generationLabel">0</strong></div>
      <div>Live Cells: <strong id="liveLabel">0</strong></div>
      <div>Speed: <strong id="speedLabel">10</strong> ticks/s</div>
      <div>Status: <strong id="statusLabel">Paused</strong></div>
    </section>

    <section class="panel">
      <canvas id="lifeCanvas" width="900" height="900"></canvas>
    </section>

    <section class="panel help">
      Click or drag to draw cells. Press <strong>Run</strong> to simulate, <strong>Step</strong> for one tick, and <strong>Randomize</strong> to quickly seed the grid.
    </section>
  </main>

  <script>
    const canvas = document.getElementById("lifeCanvas");
    const ctx = canvas.getContext("2d");

    const runBtn = document.getElementById("runBtn");
    const stepBtn = document.getElementById("stepBtn");
    const clearBtn = document.getElementById("clearBtn");
    const randomBtn = document.getElementById("randomBtn");
    const speedRange = document.getElementById("speedRange");
    const sizeSelect = document.getElementById("sizeSelect");
    const wrapSelect = document.getElementById("wrapSelect");

    const generationLabel = document.getElementById("generationLabel");
    const liveLabel = document.getElementById("liveLabel");
    const speedLabel = document.getElementById("speedLabel");
    const statusLabel = document.getElementById("statusLabel");

    let gridSize = Number(sizeSelect.value);
    let grid = makeGrid(gridSize, gridSize);
    let nextGrid = makeGrid(gridSize, gridSize);

    let running = false;
    let generation = 0;
    let speed = Number(speedRange.value);
    let wrapEdges = true;
    let lastTickMs = 0;
    let drawing = false;
    let drawState = 1;

    function makeGrid(rows, cols) {
      return Array.from({ length: rows }, () => Array(cols).fill(0));
    }

    function countLiveCells() {
      let count = 0;
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          count += grid[y][x];
        }
      }
      return count;
    }

    function getNeighborCount(x, y) {
      let neighbors = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          let nx = x + dx;
          let ny = y + dy;

          if (wrapEdges) {
            nx = (nx + gridSize) % gridSize;
            ny = (ny + gridSize) % gridSize;
            neighbors += grid[ny][nx];
          } else if (nx >= 0 && ny >= 0 && nx < gridSize && ny < gridSize) {
            neighbors += grid[ny][nx];
          }
        }
      }
      return neighbors;
    }

    function stepSimulation() {
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          const alive = grid[y][x] === 1;
          const neighbors = getNeighborCount(x, y);
          const survives = alive && (neighbors === 2 || neighbors === 3);
          const born = !alive && neighbors === 3;
          nextGrid[y][x] = survives || born ? 1 : 0;
        }
      }

      const temp = grid;
      grid = nextGrid;
      nextGrid = temp;
      generation++;
      updateStats();
      drawGrid();
    }

    function randomizeGrid() {
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          grid[y][x] = Math.random() < 0.26 ? 1 : 0;
        }
      }
      generation = 0;
      updateStats();
      drawGrid();
    }

    function clearGrid() {
      for (let y = 0; y < gridSize; y++) {
        grid[y].fill(0);
        nextGrid[y].fill(0);
      }
      generation = 0;
      updateStats();
      drawGrid();
    }

    function rebuildGrid(newSize) {
      gridSize = newSize;
      grid = makeGrid(gridSize, gridSize);
      nextGrid = makeGrid(gridSize, gridSize);
      generation = 0;
      updateStats();
      drawGrid();
    }

    function drawGrid() {
      const cell = canvas.width / gridSize;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          if (grid[y][x]) {
            ctx.fillStyle = "var(--alive)";
            ctx.fillRect(x * cell, y * cell, cell, cell);
          }
        }
      }

      ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= gridSize; i++) {
        const p = i * cell;
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(canvas.width, p);
        ctx.stroke();
      }
    }

    function updateStats() {
      generationLabel.textContent = String(generation);
      liveLabel.textContent = String(countLiveCells());
      speedLabel.textContent = String(speed);
      statusLabel.textContent = running ? "Running" : "Paused";
      runBtn.textContent = running ? "Pause" : "Run";
      runBtn.classList.toggle("primary", !running);
      runBtn.classList.toggle("warn", running);
    }

    function pointerToCell(event) {
      const rect = canvas.getBoundingClientRect();
      const px = ((event.clientX - rect.left) / rect.width) * canvas.width;
      const py = ((event.clientY - rect.top) / rect.height) * canvas.height;
      const cell = canvas.width / gridSize;
      const x = Math.floor(px / cell);
      const y = Math.floor(py / cell);
      return { x, y };
    }

    function paintAtPointer(event) {
      const { x, y } = pointerToCell(event);
      if (x < 0 || y < 0 || x >= gridSize || y >= gridSize) return;
      grid[y][x] = drawState;
      drawGrid();
      updateStats();
    }

    runBtn.addEventListener("click", () => {
      running = !running;
      updateStats();
    });

    stepBtn.addEventListener("click", () => {
      if (!running) {
        stepSimulation();
      }
    });

    clearBtn.addEventListener("click", () => {
      running = false;
      clearGrid();
    });

    randomBtn.addEventListener("click", () => {
      running = false;
      randomizeGrid();
    });

    speedRange.addEventListener("input", () => {
      speed = Number(speedRange.value);
      updateStats();
    });

    sizeSelect.addEventListener("change", () => {
      running = false;
      rebuildGrid(Number(sizeSelect.value));
    });

    wrapSelect.addEventListener("change", () => {
      wrapEdges = wrapSelect.value === "on";
    });

    canvas.addEventListener("pointerdown", (event) => {
      drawing = true;
      const { x, y } = pointerToCell(event);
      drawState = grid[y]?.[x] ? 0 : 1;
      paintAtPointer(event);
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (drawing) {
        paintAtPointer(event);
      }
    });

    canvas.addEventListener("pointerup", () => {
      drawing = false;
    });

    canvas.addEventListener("pointerleave", () => {
      drawing = false;
    });

    function loop(timestamp) {
      if (running) {
        const interval = 1000 / speed;
        if (timestamp - lastTickMs >= interval) {
          stepSimulation();
          lastTickMs = timestamp;
        }
      }
      requestAnimationFrame(loop);
    }

    updateStats();
    drawGrid();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
