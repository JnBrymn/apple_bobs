<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Platform Jumper - Don't Fall!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(to bottom, #87CEEB 0%, #98FB98 100%);
        }
        
        .ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            z-index: 100;
        }
        
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 200;
        }
        
        .game-over h2 {
            color: #FF6B6B;
            margin-bottom: 20px;
        }
        
        .restart-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .restart-btn:hover {
            background: #45a049;
        }
        
        .instructions {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 16px;
            text-align: right;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Platforms: <span id="platforms">0</span></div>
        <div>Height: <span id="height">0</span>m</div>
    </div>
    
    <div class="instructions">
        <div>🎮 Use ARROW KEYS to move</div>
        <div>⬆️ SPACE to jump</div>
        <div>🎯 Don't fall down!</div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div class="game-over" id="gameOver">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>Platforms Survived: <span id="finalPlatforms">0</span></p>
        <p>Max Height: <span id="finalHeight">0</span>m</p>
        <button class="restart-btn" onclick="restartGame()">Play Again!</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Game variables
        let score = 0;
        let platformsSurvived = 0;
        let maxHeight = 0;
        let gameRunning = true;
        let cameraY = 0;
        
        // Ball properties
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            radius: 15,
            velocityX: 0,
            velocityY: 0,
            onGround: false,
            color: '#FF6B6B'
        };
        
        // Physics constants
        const gravity = 0.8;
        const friction = 0.85;
        const jumpPower = -15;
        const moveSpeed = 8;
        
        // Platforms array
        let platforms = [];
        
        // Reachable platform generation (not fully random — each step is jumpable)
        const PLATFORM_COLORS = ['#FF9800', '#9C27B0', '#2196F3', '#FF5722', '#795548', '#E91E63'];
        const MIN_PLATFORM_GAP = 70;
        const MAX_PLATFORM_GAP = 115;
        const MIN_PLATFORM_WIDTH = 90;
        const MAX_PLATFORM_WIDTH = 170;
        const MAX_HORIZONTAL_REACH = 240;
        const PLATFORMS_TO_KEEP_AHEAD = 10;
        
        function pickPlatformColor() {
            return PLATFORM_COLORS[Math.floor(Math.random() * PLATFORM_COLORS.length)];
        }
        
        function getTopPlatform() {
            return platforms.reduce((top, p) => (p.y < top.y ? p : top), platforms[0]);
        }
        
        function countPlatformsAboveBall() {
            return platforms.filter(p => p.y < ball.y - ball.radius).length;
        }
        
        // Build one platform that is always reachable from the previous one
        function generateNextPlatform(fromPlatform) {
            const progress = Math.min(1, platforms.length / 40);
            const minGap = MIN_PLATFORM_GAP;
            const maxGap = MIN_PLATFORM_GAP + (MAX_PLATFORM_GAP - MIN_PLATFORM_GAP) * (0.4 + progress * 0.6);
            const gap = minGap + Math.random() * (maxGap - minGap);
            const y = fromPlatform.y - gap;
            
            const width = Math.max(
                MIN_PLATFORM_WIDTH,
                MAX_PLATFORM_WIDTH - progress * 35 + Math.random() * 25
            );
            const height = 15 + Math.random() * 8;
            
            const jumpFromX = fromPlatform.x + ball.radius +
                Math.random() * Math.max(1, fromPlatform.width - ball.radius * 2);
            const maxOffset = MAX_HORIZONTAL_REACH * (0.75 + progress * 0.2);
            const offsetX = (Math.random() - 0.5) * 2 * maxOffset;
            let landX = jumpFromX + offsetX;
            landX = Math.max(ball.radius, Math.min(canvas.width - ball.radius, landX));
            
            let x = landX - width / 2;
            x = Math.max(0, Math.min(canvas.width - width, x));
            
            return new Platform(x, y, width, height, pickPlatformColor());
        }
        
        // Platform class
        class Platform {
            constructor(x, y, width, height, color) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color;
                this.passed = false;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y - cameraY, this.width, this.height);
                
                // Add some depth effect
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(this.x, this.y - cameraY, this.width, 5);
            }
            
            checkCollision(ball) {
                return ball.x + ball.radius > this.x &&
                       ball.x - ball.radius < this.x + this.width &&
                       ball.y + ball.radius > this.y &&
                       ball.y - ball.radius < this.y + this.height;
            }
        }
        
        // Start with the ground platform, then a short reachable chain
        function generateInitialPlatforms() {
            platforms = [];
            let current = new Platform(canvas.width / 2 - 100, canvas.height - 50, 200, 20, '#4CAF50');
            platforms.push(current);
            
            for (let i = 0; i < 6; i++) {
                current = generateNextPlatform(current);
                platforms.push(current);
            }
        }
        
        // Add platforms one at a time as you climb — only when running low ahead
        function generateNewPlatforms() {
            while (countPlatformsAboveBall() < PLATFORMS_TO_KEEP_AHEAD) {
                const top = getTopPlatform();
                platforms.push(generateNextPlatform(top));
            }
        }
        
        // Input handling
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        // Update ball physics
        function updateBall() {
            // Apply gravity
            ball.velocityY += gravity;
            
            // Handle input
            if (keys['ArrowLeft'] || keys['KeyA']) {
                ball.velocityX -= moveSpeed * 0.1;
            }
            if (keys['ArrowRight'] || keys['KeyD']) {
                ball.velocityX += moveSpeed * 0.1;
            }
            if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && ball.onGround) {
                ball.velocityY = jumpPower;
                ball.onGround = false;
            }
            
            // Apply friction
            ball.velocityX *= friction;
            
            // Update position
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;
            
            // Keep ball in bounds
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.velocityX = 0;
            }
            if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.velocityX = 0;
            }
            
            // Check platform collisions
            ball.onGround = false;
            for (let platform of platforms) {
                if (platform.checkCollision(ball)) {
                    if (ball.velocityY > 0) {
                        ball.y = platform.y - ball.radius;
                        ball.velocityY = 0;
                        ball.onGround = true;
                        
                        // Mark platform as passed
                        if (!platform.passed) {
                            platform.passed = true;
                            platformsSurvived++;
                            score += 10;
                            document.getElementById('platforms').textContent = platformsSurvived;
                            document.getElementById('score').textContent = score;
                        }
                    }
                }
            }
            
            // Check if ball fell off screen
            if (ball.y - cameraY > canvas.height + 100) {
                gameOver();
            }
        }
        
        // Update camera
        function updateCamera() {
            const targetY = ball.y - canvas.height / 2;
            cameraY += (targetY - cameraY) * 0.1;
            
            // Update max height
            const currentHeight = Math.floor((canvas.height - ball.y) / 10);
            if (currentHeight > maxHeight) {
                maxHeight = currentHeight;
                document.getElementById('height').textContent = maxHeight;
            }
        }
        
        // Clean up old platforms
        function cleanupPlatforms() {
            platforms = platforms.filter(platform => platform.y - cameraY > -100);
        }
        
        // Draw everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#98FB98');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw clouds
            drawClouds();
            
            // Draw platforms
            for (let platform of platforms) {
                platform.draw();
            }
            
            // Draw ball
            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y - cameraY, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Add ball shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y - cameraY + ball.radius + 5, ball.radius * 0.8, 0, Math.PI * 2);
            ctx.fill();
            
            // Add ball highlight
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath();
            ctx.arc(ball.x - ball.radius * 0.3, ball.y - cameraY - ball.radius * 0.3, ball.radius * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Fixed cloud layout — sizes were random every frame and made clouds flicker
        const clouds = [
            { baseX: 80,  y: 70,  size: 72 },
            { baseX: 340, y: 140, size: 58 },
            { baseX: 620, y: 55,  size: 85 },
            { baseX: 180, y: 210, size: 64 },
            { baseX: 500, y: 175, size: 78 },
            { baseX: 760, y: 120, size: 66 }
        ];
        
        function drawClouds() {
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            const drift = Date.now() * 0.01;
            for (const cloud of clouds) {
                const x = (cloud.baseX + drift) % (canvas.width + 200) - 100;
                drawCloud(x, cloud.y, cloud.size);
            }
        }
        
        function drawCloud(x, y, size) {
            const puffs = [
                [x, y, size * 0.5],
                [x + size * 0.4, y, size * 0.6],
                [x + size * 0.8, y, size * 0.5],
                [x + size * 0.6, y - size * 0.2, size * 0.4],
                [x + size * 0.2, y - size * 0.3, size * 0.5]
            ];
            for (const [cx, cy, r] of puffs) {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalPlatforms').textContent = platformsSurvived;
            document.getElementById('finalHeight').textContent = maxHeight;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // Restart game
        function restartGame() {
            score = 0;
            platformsSurvived = 0;
            maxHeight = 0;
            gameRunning = true;
            cameraY = 0;
            
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 100;
            ball.velocityX = 0;
            ball.velocityY = 0;
            ball.onGround = false;
            
            platforms = [];
            generateInitialPlatforms();
            
            document.getElementById('score').textContent = score;
            document.getElementById('platforms').textContent = platformsSurvived;
            document.getElementById('height').textContent = maxHeight;
            document.getElementById('gameOver').style.display = 'none';
        }
        
        // Game loop
        function gameLoop() {
            if (gameRunning) {
                updateBall();
                updateCamera();
                generateNewPlatforms();
                cleanupPlatforms();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // Start the game
        generateInitialPlatforms();
        gameLoop();
    </script>
</body>
</html>
