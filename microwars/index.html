<!--
Bo's request:
- Make "microwars from poki".
- "Just make it" (no extra setup questions).
- Add harder levels.
- Add a main menu with Continue, New Game, and Settings.
- Add upgrades in main menu bought with coins.

Current game plan:
- Single-file arcade micro war game.
- Top-down style with tiny soldiers.
- 1 player vs computer enemies.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MicroWars</title>
  <style>
    :root {
      --bg: #0f1422;
      --panel: #1b2338;
      --ink: #e8efff;
      --blue: #4da3ff;
      --red: #ff5b6b;
      --gold: #ffd166;
      --green: #66d17a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: radial-gradient(circle at 30% 20%, #1d2a44 0%, var(--bg) 50%, #0a0d17 100%);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 14px;
    }
    .game-wrap {
      width: min(940px, 100%);
      background: color-mix(in oklab, var(--panel), black 12%);
      border: 2px solid #3a4b73;
      border-radius: 14px;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      overflow: hidden;
    }
    .hud {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1.2fr;
      gap: 8px;
      padding: 10px 12px;
      background: #111a2d;
      border-bottom: 2px solid #34476f;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.2;
    }
    .card {
      background: #1a2440;
      border: 1px solid #3d527f;
      border-radius: 8px;
      padding: 8px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .blue { color: var(--blue); }
    .red { color: var(--red); }
    .gold { color: var(--gold); }
    #game {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
      background: linear-gradient(#213553, #18263e);
      image-rendering: pixelated;
      cursor: crosshair;
    }
    .controls {
      padding: 10px 12px;
      border-top: 2px solid #34476f;
      background: #111a2d;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    kbd {
      background: #2c3f69;
      border: 1px solid #5877b1;
      border-bottom-width: 3px;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 12px;
      color: #f2f7ff;
    }
    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 10, 20, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 25;
      padding: 14px;
    }
    .menu-overlay.open { display: flex; }
    .menu-box {
      width: min(760px, 100%);
      background: #121b31;
      border: 2px solid #40598c;
      border-radius: 14px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.55);
      padding: 14px;
    }
    .menu-title {
      margin: 0 0 12px;
      font-size: 32px;
      text-align: center;
      color: #eaf1ff;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .menu-panel {
      background: #1a2643;
      border: 1px solid #46639b;
      border-radius: 10px;
      padding: 10px;
    }
    .menu-panel h3 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #cfe0ff;
    }
    .menu-buttons {
      display: grid;
      gap: 8px;
    }
    .menu-btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #5377b8;
      background: #2a3d68;
      color: #eef4ff;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
    }
    .menu-btn:hover { filter: brightness(1.08); }
    .menu-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .tiny {
      opacity: 0.86;
      font-size: 12px;
      margin-top: 6px;
    }
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid #33496f;
      font-size: 14px;
    }
    .settings-row:last-child { border-bottom: 0; }
    .pill {
      border-radius: 999px;
      padding: 3px 10px;
      border: 1px solid #5a7ebf;
      background: #25395f;
      color: #eff5ff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="hud">
      <div class="card"><span id="statusText">Secure all zones!</span></div>
      <div class="card blue">Your Team: <span id="allyCount">0</span></div>
      <div class="card red">Enemy Team: <span id="enemyCount">0</span></div>
      <div class="card gold">Coins: <span id="coins">0</span> | Kills: <span id="kills">0</span></div>
    </div>
    <canvas id="game" width="960" height="540"></canvas>
    <div class="controls">
      <div>
        Move <kbd>W A S D</kbd> or <kbd>Arrow Keys</kbd>, aim with mouse, shoot with <kbd>Click</kbd> or <kbd>Space</kbd>, menu <kbd>Esc</kbd>
      </div>
      <div>
        Spawn soldier: <kbd>Q</kbd> (20 coins) | Med pack: <kbd>E</kbd> (35 coins)
      </div>
    </div>
  </div>
  <div id="mainMenu" class="menu-overlay open">
    <div class="menu-box">
      <h1 class="menu-title">MICROWARS</h1>
      <div class="menu-grid">
        <section class="menu-panel">
          <h3>Main Menu</h3>
          <div class="menu-buttons">
            <button id="continueBtn" class="menu-btn">Continue</button>
            <button id="newGameBtn" class="menu-btn">New Game</button>
            <button id="settingsBtn" class="menu-btn">Settings</button>
          </div>
          <p class="tiny" id="menuInfo"></p>
        </section>
        <section class="menu-panel">
          <h3>Upgrades (use coins)</h3>
          <div class="menu-buttons">
            <button id="upgradeDamageBtn" class="menu-btn"></button>
            <button id="upgradeHealthBtn" class="menu-btn"></button>
            <button id="upgradeSpeedBtn" class="menu-btn"></button>
          </div>
        </section>
      </div>
      <section id="settingsPanel" class="menu-panel" style="margin-top:12px;display:none;">
        <h3>Settings</h3>
        <div class="settings-row">
          <span>Difficulty</span>
          <button id="difficultyBtn" class="pill">Normal</button>
        </div>
        <div class="settings-row">
          <span>Screen Shake</span>
          <button id="shakeBtn" class="pill">On</button>
        </div>
      </section>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("statusText");
    const allyCountEl = document.getElementById("allyCount");
    const enemyCountEl = document.getElementById("enemyCount");
    const coinsEl = document.getElementById("coins");
    const killsEl = document.getElementById("kills");
    const mainMenu = document.getElementById("mainMenu");
    const continueBtn = document.getElementById("continueBtn");
    const newGameBtn = document.getElementById("newGameBtn");
    const settingsBtn = document.getElementById("settingsBtn");
    const menuInfo = document.getElementById("menuInfo");
    const settingsPanel = document.getElementById("settingsPanel");
    const difficultyBtn = document.getElementById("difficultyBtn");
    const shakeBtn = document.getElementById("shakeBtn");
    const upgradeDamageBtn = document.getElementById("upgradeDamageBtn");
    const upgradeHealthBtn = document.getElementById("upgradeHealthBtn");
    const upgradeSpeedBtn = document.getElementById("upgradeSpeedBtn");

    const keys = new Set();
    const mouse = { x: 480, y: 270, down: false };
    const rand = (a, b) => Math.random() * (b - a) + a;
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    const SAVE_KEY = "microwars-save-v2";
    const prog = { coins: 0, bestLevel: 1, currentLevel: 1, hasActiveRun: false };
    const upgrades = { damage: 0, health: 0, speed: 0 };
    const settings = { difficulty: "normal", screenShake: true };

    const world = {
      w: canvas.width,
      h: canvas.height,
      t: 0,
      dt: 0,
      score: 0,
      kills: 0,
      gameOver: false,
      win: false,
      inMenu: true,
      roundHandled: false,
      enemySpawnTick: 0,
      captureWinTimer: 0,
      level: 1
    };

    function loadSave() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        prog.coins = Math.max(0, Math.floor(data.coins || 0));
        prog.bestLevel = clamp(Math.floor(data.bestLevel || 1), 1, 999);
        prog.currentLevel = clamp(Math.floor(data.currentLevel || 1), 1, 999);
        prog.hasActiveRun = Boolean(data.hasActiveRun);
        upgrades.damage = clamp(Math.floor(data.upgrades?.damage || 0), 0, 10);
        upgrades.health = clamp(Math.floor(data.upgrades?.health || 0), 0, 10);
        upgrades.speed = clamp(Math.floor(data.upgrades?.speed || 0), 0, 10);
        settings.difficulty = data.settings?.difficulty === "hard" ? "hard" : "normal";
        settings.screenShake = data.settings?.screenShake !== false;
      } catch (err) {
        console.warn("Could not load save", err);
      }
    }

    function saveGame() {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ prog, upgrades, settings }));
    }

    function getLevelScale() {
      const diff = settings.difficulty === "hard" ? 1.2 : 1;
      return 1 + (world.level - 1) * 0.18 * diff;
    }

    function makeUnit(team, x, y) {
      const enemyScale = team === "enemy" ? getLevelScale() : 1;
      return {
        x, y, vx: 0, vy: 0, r: 8, team,
        hp: team === "enemy" ? 95 + (world.level - 1) * 18 : 100,
        reload: rand(0.08, 0.3),
        speed: team === "ally" ? 78 : 68 * enemyScale
      };
    }

    const player = {
      x: 160, y: 270, r: 10,
      hp: 150, maxHp: 150, speed: 150,
      reload: 0, damageBoost: 1
    };
    const allies = [];
    const enemies = [];
    const bullets = [];
    const particles = [];
    const packs = [];
    const zones = [
      { x: 250, y: 130, r: 52, owner: "neutral", progress: 0 },
      { x: 700, y: 150, r: 52, owner: "enemy", progress: -0.75 },
      { x: 500, y: 390, r: 62, owner: "neutral", progress: 0 }
    ];

    function applyPlayerUpgrades() {
      player.maxHp = 150 + upgrades.health * 20;
      player.speed = 150 + upgrades.speed * 12;
      player.damageBoost = 1 + upgrades.damage * 0.1;
    }

    function spawnEnemyWave() {
      const side = Math.random() < 0.5 ? "right" : "top";
      const n = clamp(1 + Math.floor(world.t / 32) + Math.floor((world.level - 1) / 2), 1, 7);
      for (let i = 0; i < n; i++) {
        const x = side === "right" ? rand(900, 930) : rand(180, 900);
        const y = side === "right" ? rand(80, 500) : rand(-20, 20);
        enemies.push(makeUnit("enemy", x, y));
      }
    }

    function fireBullet(from, tx, ty, team, speed = 360, damage = 34) {
      const dx = tx - from.x;
      const dy = ty - from.y;
      const mag = Math.hypot(dx, dy) || 1;
      bullets.push({
        x: from.x, y: from.y, life: 1.2, team,
        vx: dx / mag * speed, vy: dy / mag * speed,
        damage: damage * (team === "ally" ? player.damageBoost : 1)
      });
    }

    function hitEffect(x, y, color) {
      for (let i = 0; i < 8; i++) particles.push({ x, y, vx: rand(-130, 130), vy: rand(-130, 130), life: rand(0.15, 0.5), color });
    }

    function updatePlayer(dt) {
      let mx = 0, my = 0;
      if (keys.has("a") || keys.has("arrowleft")) mx -= 1;
      if (keys.has("d") || keys.has("arrowright")) mx += 1;
      if (keys.has("w") || keys.has("arrowup")) my -= 1;
      if (keys.has("s") || keys.has("arrowdown")) my += 1;
      if (mx || my) {
        const m = Math.hypot(mx, my);
        player.x += mx / m * player.speed * dt;
        player.y += my / m * player.speed * dt;
      }
      player.x = clamp(player.x, 16, world.w - 16);
      player.y = clamp(player.y, 16, world.h - 16);
      player.reload -= dt;
      if (player.reload <= 0 && (mouse.down || keys.has(" "))) {
        fireBullet(player, mouse.x, mouse.y, "ally", 460, 38);
        player.reload = 0.16;
      }
    }

    function closestEnemyTo(x, y, fromEnemyTeam = false) {
      const list = fromEnemyTeam ? allies.concat([player]) : enemies;
      let best = null;
      let bestD = Infinity;
      for (const u of list) {
        if (u.hp <= 0) continue;
        const d = Math.hypot(u.x - x, u.y - y);
        if (d < bestD) { bestD = d; best = u; }
      }
      return best;
    }

    function nearestZone(x, y) {
      let best = zones[0];
      let bestD = Infinity;
      for (const z of zones) {
        const d = Math.hypot(z.x - x, z.y - y);
        if (d < bestD) { bestD = d; best = z; }
      }
      return best;
    }

    function moveToward(unit, tx, ty, dt, wiggle = 0) {
      const dx = tx - unit.x + rand(-wiggle, wiggle);
      const dy = ty - unit.y + rand(-wiggle, wiggle);
      const m = Math.hypot(dx, dy) || 1;
      unit.vx = dx / m * unit.speed;
      unit.vy = dy / m * unit.speed;
      unit.x = clamp(unit.x + unit.vx * dt, 10, world.w - 10);
      unit.y = clamp(unit.y + unit.vy * dt, 10, world.h - 10);
    }

    function updateAI(list, enemyTeam) {
      for (const u of list) {
        if (u.hp <= 0) continue;
        u.reload -= world.dt;
        const target = closestEnemyTo(u.x, u.y, enemyTeam);
        const zone = nearestZone(u.x, u.y);
        if (target && dist(u, target) < 170) {
          moveToward(u, target.x, target.y, world.dt, 15);
          if (u.reload <= 0 && dist(u, target) < 150) {
            fireBullet(u, target.x + rand(-8, 8), target.y + rand(-8, 8), u.team, 330, 24);
            u.reload = rand(0.45, 0.9) / (enemyTeam ? getLevelScale() : 1);
          }
        } else {
          moveToward(u, zone.x, zone.y, world.dt, 18);
        }
      }
    }

    function updateZones(dt) {
      for (const z of zones) {
        let allyNear = 0;
        let enemyNear = 0;
        if (Math.hypot(player.x - z.x, player.y - z.y) < z.r + 10 && player.hp > 0) allyNear++;
        for (const a of allies) if (a.hp > 0 && Math.hypot(a.x - z.x, a.y - z.y) < z.r + 6) allyNear++;
        for (const e of enemies) if (e.hp > 0 && Math.hypot(e.x - z.x, e.y - z.y) < z.r + 6) enemyNear++;
        if (allyNear > enemyNear) z.progress += dt * 0.18 * (allyNear - enemyNear);
        else if (enemyNear > allyNear) z.progress -= dt * 0.18 * (enemyNear - allyNear);
        else z.progress *= 0.997;
        z.progress = clamp(z.progress, -1, 1);
        if (z.progress > 0.72) z.owner = "ally";
        else if (z.progress < -0.72) z.owner = "enemy";
        else z.owner = "neutral";
      }
      const allOwned = zones.every(z => z.owner === "ally");
      world.captureWinTimer = allOwned ? world.captureWinTimer + dt : 0;
      if (world.captureWinTimer > 7) { world.gameOver = true; world.win = true; }
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        if (b.life <= 0 || b.x < -20 || b.y < -20 || b.x > world.w + 20 || b.y > world.h + 20) { bullets.splice(i, 1); continue; }
        const targets = b.team === "ally" ? enemies : allies.concat([player]);
        let hit = null;
        for (const t of targets) {
          if (t.hp <= 0) continue;
          const rr = t.r + 2;
          if ((b.x - t.x) ** 2 + (b.y - t.y) ** 2 < rr * rr) { hit = t; break; }
        }
        if (!hit) continue;
        hit.hp -= b.damage;
        hitEffect(b.x, b.y, b.team === "ally" ? "#86c1ff" : "#ff8b93");
        bullets.splice(i, 1);
        if (hit.hp > 0) continue;
        if (hit === player) { world.gameOver = true; world.win = false; }
        else if (hit.team === "enemy") {
          world.score += 10;
          world.kills++;
          if (Math.random() < 0.12) packs.push({ x: hit.x, y: hit.y, life: 8 });
        } else {
          world.score = Math.max(0, world.score - 6);
        }
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= 0.95; p.vy *= 0.95; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function updatePacks(dt) {
      for (let i = packs.length - 1; i >= 0; i--) {
        const p = packs[i];
        p.life -= dt;
        if (p.life <= 0) { packs.splice(i, 1); continue; }
        if (Math.hypot(player.x - p.x, player.y - p.y) < 18) {
          player.hp = clamp(player.hp + 45, 0, player.maxHp);
          packs.splice(i, 1);
          world.score += 6;
        }
      }
    }

    function cleanupUnits() {
      for (let i = allies.length - 1; i >= 0; i--) if (allies[i].hp <= 0) allies.splice(i, 1);
      for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].hp <= 0) enemies.splice(i, 1);
    }

    function drawGrid() {
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = "#89a8d2";
      for (let x = 0; x <= world.w; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, world.h); ctx.stroke(); }
      for (let y = 0; y <= world.h; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(world.w, y); ctx.stroke(); }
      ctx.restore();
    }

    function drawZone(z) {
      const c = z.owner === "ally" ? "#4da3ff" : z.owner === "enemy" ? "#ff5b6b" : "#c4cad6";
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = c;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "#ffffffcc";
      ctx.lineWidth = 5;
      ctx.beginPath();
      const ang = ((z.progress + 1) / 2) * Math.PI * 2;
      ctx.arc(z.x, z.y, z.r - 8, -Math.PI / 2, -Math.PI / 2 + ang);
      ctx.stroke();
      ctx.restore();
    }

    function drawUnit(u) {
      if (u.hp <= 0) return;
      const ally = u.team === "ally";
      ctx.fillStyle = ally ? "#60b1ff" : "#ff6e7b";
      ctx.beginPath();
      ctx.arc(u.x, u.y, u.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#061124";
      ctx.beginPath();
      ctx.arc(u.x + (ally ? 2 : -2), u.y - 1, 2, 0, Math.PI * 2);
      ctx.fill();
      const hpw = 20;
      const maxHp = ally ? 100 : (95 + (world.level - 1) * 18);
      ctx.fillStyle = "#00000070";
      ctx.fillRect(u.x - hpw / 2, u.y - 15, hpw, 4);
      ctx.fillStyle = ally ? "#7ed2ff" : "#ff9aa4";
      ctx.fillRect(u.x - hpw / 2, u.y - 15, hpw * clamp(u.hp / maxHp, 0, 1), 4);
    }

    function drawPlayer() {
      ctx.fillStyle = "#79e87f";
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fill();
      const ang = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      ctx.strokeStyle = "#d8ffe0";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(player.x + Math.cos(ang) * 14, player.y + Math.sin(ang) * 14);
      ctx.stroke();
      ctx.fillStyle = "#00000090";
      ctx.fillRect(player.x - 26, player.y - 23, 52, 6);
      ctx.fillStyle = "#69e27d";
      ctx.fillRect(player.x - 26, player.y - 23, 52 * (player.hp / player.maxHp), 6);
    }

    function drawBullets() {
      for (const b of bullets) {
        ctx.fillStyle = b.team === "ally" ? "#a8d7ff" : "#ffc5cc";
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life * 2);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2.4, 2.4);
      }
      ctx.globalAlpha = 1;
    }

    function drawPacks() {
      for (const p of packs) {
        ctx.fillStyle = "#ffe07a";
        ctx.fillRect(p.x - 6, p.y - 6, 12, 12);
        ctx.fillStyle = "#614b05";
        ctx.fillRect(p.x - 2, p.y - 6, 4, 12);
        ctx.fillRect(p.x - 6, p.y - 2, 12, 4);
      }
    }

    function drawOverlay() {
      if (!world.gameOver || world.inMenu) return;
      ctx.fillStyle = "#000a";
      ctx.fillRect(0, 0, world.w, world.h);
      ctx.fillStyle = world.win ? "#79ff9a" : "#ff8895";
      ctx.font = "bold 54px Trebuchet MS, Arial";
      ctx.textAlign = "center";
      ctx.fillText(world.win ? "VICTORY!" : "YOU LOST", world.w / 2, world.h / 2 - 12);
      ctx.fillStyle = "#f0f5ff";
      ctx.font = "bold 22px Trebuchet MS, Arial";
      ctx.fillText("Press Esc for menu", world.w / 2, world.h / 2 + 34);
    }

    function render() {
      ctx.clearRect(0, 0, world.w, world.h);
      drawGrid();
      zones.forEach(drawZone);
      drawPacks();
      drawBullets();
      drawParticles();
      allies.forEach(drawUnit);
      enemies.forEach(drawUnit);
      drawPlayer();
      drawOverlay();
    }

    function updateHud() {
      allyCountEl.textContent = String(allies.length + (player.hp > 0 ? 1 : 0));
      enemyCountEl.textContent = String(enemies.length);
      coinsEl.textContent = String(Math.floor(world.score));
      killsEl.textContent = String(world.kills);
      if (world.gameOver) statusText.textContent = world.win ? "Level cleared!" : "Defeat... open menu.";
      else statusText.textContent = `Level ${world.level} | Capture zones: ${zones.filter(z => z.owner === "ally").length}/${zones.length}`;
    }

    function openMenu(message = "") {
      world.inMenu = true;
      mainMenu.classList.add("open");
      menuInfo.textContent = `${message ? message + " | " : ""}Coins ${prog.coins} | Next Level ${prog.currentLevel}`;
      continueBtn.disabled = !prog.hasActiveRun;
      difficultyBtn.textContent = settings.difficulty === "hard" ? "Hard" : "Normal";
      shakeBtn.textContent = settings.screenShake ? "On" : "Off";
      upgradeDamageBtn.textContent = `Damage +10% (Lv ${upgrades.damage}/10) - ${80 + upgrades.damage * 55} coins`;
      upgradeHealthBtn.textContent = `Max HP +20 (Lv ${upgrades.health}/10) - ${95 + upgrades.health * 70} coins`;
      upgradeSpeedBtn.textContent = `Speed +8% (Lv ${upgrades.speed}/10) - ${110 + upgrades.speed * 90} coins`;
      saveGame();
    }

    function closeMenu() {
      mainMenu.classList.remove("open");
      world.inMenu = false;
    }

    function resetGame(level = 1) {
      world.level = clamp(level, 1, 999);
      world.t = 0;
      world.dt = 0;
      world.score = 0;
      world.kills = 0;
      world.gameOver = false;
      world.win = false;
      world.roundHandled = false;
      world.enemySpawnTick = 0;
      world.captureWinTimer = 0;
      applyPlayerUpgrades();
      player.x = 160;
      player.y = 270;
      player.hp = player.maxHp;
      player.reload = 0;
      allies.length = 0;
      enemies.length = 0;
      bullets.length = 0;
      particles.length = 0;
      packs.length = 0;
      allies.push(makeUnit("ally", 210, 260), makeUnit("ally", 235, 290));
      enemies.push(makeUnit("enemy", 780, 250), makeUnit("enemy", 825, 300));
      for (let i = 1; i < Math.min(1 + Math.floor(world.level / 2), 6); i++) enemies.push(makeUnit("enemy", rand(680, 900), rand(180, 360)));
      zones[0].owner = "neutral"; zones[0].progress = 0;
      zones[1].owner = "enemy"; zones[1].progress = -0.75;
      zones[2].owner = "neutral"; zones[2].progress = 0;
      closeMenu();
    }

    function recruitAlly() {
      if (world.score < 20 || world.gameOver || world.inMenu) return;
      world.score -= 20;
      allies.push(makeUnit("ally", player.x + rand(-28, 28), player.y + rand(-28, 28)));
    }

    function buyMed() {
      if (world.score < 35 || world.gameOver || world.inMenu || player.hp >= player.maxHp) return;
      world.score -= 35;
      player.hp = clamp(player.hp + 70, 0, player.maxHp);
      hitEffect(player.x, player.y, "#a6ffb8");
    }

    function tryBuyUpgrade(kind) {
      const base = { damage: 80, health: 95, speed: 110 }[kind];
      const growth = { damage: 55, health: 70, speed: 90 }[kind];
      if (upgrades[kind] >= 10) return openMenu("Max level reached");
      const cost = base + upgrades[kind] * growth;
      if (prog.coins < cost) return openMenu("Not enough coins");
      prog.coins -= cost;
      upgrades[kind]++;
      applyPlayerUpgrades();
      openMenu("Upgrade bought");
    }

    function logic(dt) {
      if (world.gameOver || world.inMenu) return;
      updatePlayer(dt);
      updateAI(allies, false);
      updateAI(enemies, true);
      updateBullets(dt);
      updateParticles(dt);
      updatePacks(dt);
      updateZones(dt);
      cleanupUnits();
      world.enemySpawnTick += dt;
      const minTick = settings.difficulty === "hard" ? 1.6 : 2.2;
      if (world.enemySpawnTick > clamp(6.6 - world.t * 0.04 - (world.level - 1) * 0.12, minTick, 7)) {
        world.enemySpawnTick = 0;
        spawnEnemyWave();
      }
      world.score += dt * 1.8;
      if (enemies.length > 42) {
        world.gameOver = true;
        world.win = false;
      }
      if (world.gameOver && !world.roundHandled) {
        world.roundHandled = true;
        if (world.win) {
          const bonus = 30 + world.level * 10;
          prog.coins += bonus;
          prog.currentLevel = world.level + 1;
          prog.bestLevel = Math.max(prog.bestLevel, prog.currentLevel);
          prog.hasActiveRun = true;
          openMenu(`Level clear! +${bonus} coins`);
        } else {
          prog.hasActiveRun = false;
          prog.currentLevel = 1;
          openMenu("Run ended");
        }
      }
    }

    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      keys.add(k);
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
      if (k === "r" && !world.inMenu) resetGame(world.level);
      if (k === "q") recruitAlly();
      if (k === "e") buyMed();
      if (k === "escape") {
        if (world.inMenu && prog.hasActiveRun) resetGame(prog.currentLevel);
        else openMenu();
      }
    });
    document.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
    canvas.addEventListener("mousemove", (e) => {
      const r = canvas.getBoundingClientRect();
      mouse.x = (e.clientX - r.left) * (canvas.width / r.width);
      mouse.y = (e.clientY - r.top) * (canvas.height / r.height);
    });
    canvas.addEventListener("mousedown", () => { mouse.down = true; });
    window.addEventListener("mouseup", () => { mouse.down = false; });

    continueBtn.addEventListener("click", () => { if (prog.hasActiveRun) resetGame(prog.currentLevel); });
    newGameBtn.addEventListener("click", () => {
      prog.currentLevel = 1;
      prog.hasActiveRun = true;
      resetGame(1);
    });
    settingsBtn.addEventListener("click", () => {
      settingsPanel.style.display = settingsPanel.style.display === "none" ? "block" : "none";
    });
    difficultyBtn.addEventListener("click", () => {
      settings.difficulty = settings.difficulty === "hard" ? "normal" : "hard";
      openMenu("Difficulty changed");
    });
    shakeBtn.addEventListener("click", () => {
      settings.screenShake = !settings.screenShake;
      openMenu("Settings saved");
    });
    upgradeDamageBtn.addEventListener("click", () => tryBuyUpgrade("damage"));
    upgradeHealthBtn.addEventListener("click", () => tryBuyUpgrade("health"));
    upgradeSpeedBtn.addEventListener("click", () => tryBuyUpgrade("speed"));

    let last = performance.now();
    function loop(now) {
      world.dt = Math.min(0.033, (now - last) / 1000);
      world.t += world.dt;
      last = now;
      logic(world.dt);
      render();
      updateHud();
      requestAnimationFrame(loop);
    }

    loadSave();
    applyPlayerUpgrades();
    openMenu("Welcome");
    requestAnimationFrame(loop);
  </script>
</body>
</html>
