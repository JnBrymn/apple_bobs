<!-- Bo asked: "make cookie clicker" and then "just make it". Single-file Cookie Clicker with upgrades, auto-clickers, save/load, and a win goal. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker</title>
  <style>
    :root {
      --bg1: #3b1d0a;
      --bg2: #6f3d1a;
      --panel: #fff7ee;
      --ink: #2b1b10;
      --accent: #cf7a1a;
      --good: #2f8f3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Verdana, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 10%, #8a4c1f 0%, var(--bg2) 30%, var(--bg1) 100%);
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .app {
      width: min(980px, 100%);
      background: var(--panel);
      border: 4px solid #4e2b13;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      padding: 18px;
    }
    h1 { margin: 0 0 10px; text-align: center; }
    .top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
    }
    .stats, .goal {
      background: #fff;
      border: 2px solid #d9bca1;
      border-radius: 14px;
      padding: 12px;
      min-height: 100%;
    }
    .big { font-size: clamp(1.4rem, 3.3vw, 2rem); font-weight: 700; }
    .muted { color: #6d4f3e; }
    #cookieBtn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 8px solid #663a19;
      background: radial-gradient(circle at 35% 30%, #f2ba73 0%, #cf7a1a 60%, #9a5411 100%);
      cursor: pointer;
      position: relative;
      transition: transform 90ms ease;
    }
    #cookieBtn:hover { transform: scale(1.05); }
    #cookieBtn:active { transform: scale(0.95); }
    #cookieBtn::before, #cookieBtn::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: #5e3416;
    }
    #cookieBtn::before { width: 28px; height: 28px; top: 35px; left: 38px; }
    #cookieBtn::after { width: 20px; height: 20px; top: 95px; right: 42px; }
    .pop {
      position: fixed;
      font-weight: 700;
      color: var(--good);
      pointer-events: none;
      animation: floatUp 700ms ease forwards;
    }
    @keyframes floatUp {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-34px); }
    }
    .store {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .item {
      border: 2px solid #d9bca1;
      border-radius: 12px;
      background: #fff;
      padding: 10px;
      text-align: left;
      cursor: pointer;
    }
    .item.disabled { opacity: 0.55; cursor: not-allowed; }
    .item-title { font-weight: 700; margin-bottom: 4px; }
    .controls {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button.ctrl {
      border: 2px solid #4e2b13;
      background: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    #winBanner {
      display: none;
      margin-top: 14px;
      text-align: center;
      font-weight: 700;
      color: var(--good);
      font-size: 1.1rem;
    }
    @media (max-width: 860px) {
      .top { grid-template-columns: 1fr; justify-items: center; }
      .store { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Cookie Clicker</h1>
    <section class="top">
      <div class="stats">
        <div class="big" id="cookieCount">0 cookies</div>
        <div class="muted" id="cpsText">0 per second</div>
        <div class="muted" id="clickText">1 per click</div>
      </div>
      <button id="cookieBtn" aria-label="Cookie"></button>
      <div class="goal">
        <div><strong>Goal:</strong> <span id="goalNum">10000</span> cookies</div>
        <div class="muted" id="goalStatus">Keep clicking!</div>
      </div>
    </section>

    <section class="store" id="store"></section>
    <div class="controls">
      <button class="ctrl" id="saveBtn">Save</button>
      <button class="ctrl" id="loadBtn">Load</button>
      <button class="ctrl" id="resetBtn">Reset</button>
    </div>
    <div id="winBanner">You win! You baked a cookie mountain!</div>
  </main>

  <script>
    const SAVE_KEY = "bo_cookie_clicker_save_v1";
    const WIN_GOAL = 10000;
    const state = {
      cookies: 0,
      cookiesPerClick: 1,
      totalClicked: 0,
      won: false,
      items: {
        cursor: { name: "Cursor", count: 0, baseCost: 15, cost: 15, addCps: 0.1, addClick: 0 },
        grandma: { name: "Grandma", count: 0, baseCost: 80, cost: 80, addCps: 1, addClick: 0 },
        oven: { name: "Mini Oven", count: 0, baseCost: 300, cost: 300, addCps: 4, addClick: 0 },
        factory: { name: "Factory", count: 0, baseCost: 1200, cost: 1200, addCps: 12, addClick: 0 },
        sprinkles: { name: "Sprinkles", count: 0, baseCost: 50, cost: 50, addCps: 0, addClick: 1 },
        glove: { name: "Power Glove", count: 0, baseCost: 250, cost: 250, addCps: 0, addClick: 5 },
        robot: { name: "Robot Baker", count: 0, baseCost: 2000, cost: 2000, addCps: 30, addClick: 0 },
        portal: { name: "Cookie Portal", count: 0, baseCost: 6500, cost: 6500, addCps: 85, addClick: 0 }
      }
    };

    const cookieBtn = document.getElementById("cookieBtn");
    const cookieCount = document.getElementById("cookieCount");
    const cpsText = document.getElementById("cpsText");
    const clickText = document.getElementById("clickText");
    const goalNum = document.getElementById("goalNum");
    const goalStatus = document.getElementById("goalStatus");
    const store = document.getElementById("store");
    const winBanner = document.getElementById("winBanner");
    goalNum.textContent = WIN_GOAL.toLocaleString();

    function getCps() {
      let cps = 0;
      for (const item of Object.values(state.items)) cps += item.count * item.addCps;
      return cps;
    }

    function updateUi() {
      cookieCount.textContent = `${Math.floor(state.cookies).toLocaleString()} cookies`;
      cpsText.textContent = `${getCps().toFixed(1)} per second`;
      clickText.textContent = `${state.cookiesPerClick} per click`;
      goalStatus.textContent = state.cookies >= WIN_GOAL ? "Goal reached!" : `${Math.floor(WIN_GOAL - state.cookies).toLocaleString()} to go`;
      if (!state.won && state.cookies >= WIN_GOAL) {
        state.won = true;
        winBanner.style.display = "block";
      }
      drawStore();
    }

    function drawStore() {
      store.innerHTML = "";
      for (const [key, item] of Object.entries(state.items)) {
        const card = document.createElement("button");
        const canBuy = state.cookies >= item.cost;
        card.className = `item${canBuy ? "" : " disabled"}`;
        card.disabled = !canBuy;
        card.innerHTML = `
          <div class="item-title">${item.name}</div>
          <div>Cost: ${Math.floor(item.cost).toLocaleString()}</div>
          <div>Owned: ${item.count}</div>
          <div class="muted">${item.addCps ? `+${item.addCps}/s` : `+${item.addClick} click`}</div>
        `;
        card.addEventListener("click", () => buy(key));
        store.appendChild(card);
      }
    }

    function popText(x, y, text) {
      const el = document.createElement("div");
      el.className = "pop";
      el.textContent = text;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }

    function clickCookie(event) {
      state.cookies += state.cookiesPerClick;
      state.totalClicked += 1;
      popText(event.clientX + 10, event.clientY - 10, `+${state.cookiesPerClick}`);
      updateUi();
    }

    function buy(key) {
      const item = state.items[key];
      if (state.cookies < item.cost) return;
      state.cookies -= item.cost;
      item.count += 1;
      state.cookiesPerClick += item.addClick;
      item.cost = Math.ceil(item.baseCost * Math.pow(1.15, item.count));
      updateUi();
    }

    function saveGame() {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }

    function loadGame() {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      try {
        const loaded = JSON.parse(raw);
        if (!loaded || typeof loaded !== "object") return;
        Object.assign(state, loaded);
        updateUi();
      } catch {
        // Ignore bad save data.
      }
    }

    function resetGame() {
      localStorage.removeItem(SAVE_KEY);
      location.reload();
    }

    cookieBtn.addEventListener("click", clickCookie);
    document.getElementById("saveBtn").addEventListener("click", saveGame);
    document.getElementById("loadBtn").addEventListener("click", loadGame);
    document.getElementById("resetBtn").addEventListener("click", resetGame);

    setInterval(() => {
      state.cookies += getCps() / 10;
      updateUi();
    }, 100);

    setInterval(saveGame, 5000);

    loadGame();
    updateUi();
  </script>
</body>
</html>
