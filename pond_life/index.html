<!--
Pond Life — ecosystem simulation starter for you to change!

HOW IT WORKS: Pick a creature and click the pond to add it. Everything moves and
lives on its own. Fish eat bugs. Frogs eat bugs. Plants help bugs multiply.
Watch populations rise and fall.

CHANGE ME IDEAS:
- SPECIES — add turtles, ducks, algae, snakes
- RULES in simTick() — who eats who, spawn rates
- POND_W / POND_H — bigger pond
- weather() — rain, drought, winter
- disasters — pollution, herons, heat wave
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pond Life</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(180deg, #a8dadc 0%, #457b9d 100%);
            min-height: 100vh;
            color: #1d3557;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255,255,255,0.9);
            padding: 10px 16px;
            border-bottom: 3px solid #457b9d;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        h1 { font-size: 1.5rem; }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .stat {
            background: #e9f5f8;
            border: 2px solid #457b9d;
            border-radius: 8px;
            padding: 5px 10px;
        }

        .layout {
            flex: 1;
            display: flex;
            padding: 12px;
            gap: 12px;
            min-height: 0;
        }

        .sidebar {
            width: 200px;
            background: rgba(255,255,255,0.94);
            border: 3px solid #457b9d;
            border-radius: 14px;
            padding: 12px;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #457b9d;
            margin: 10px 0 6px;
            border-bottom: 2px solid #a8dadc;
            padding-bottom: 3px;
        }

        .section-title:first-child { margin-top: 0; }

        .spawn-btn, .action-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 9px 10px;
            margin-bottom: 5px;
            border: 2px solid #a8dadc;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            font-size: 0.92rem;
        }

        .spawn-btn:hover, .action-btn:hover { background: #f1faee; }

        .spawn-btn.selected {
            background: #457b9d;
            color: #fff;
            border-color: #1d3557;
        }

        .pond-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            border: 4px solid #1d3557;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            cursor: crosshair;
            max-width: 100%;
        }

        .hint {
            margin-top: 10px;
            font-size: 0.88rem;
            background: rgba(255,255,255,0.85);
            padding: 8px 14px;
            border-radius: 10px;
            text-align: center;
            max-width: 720px;
        }

        .log {
            margin-top: 8px;
            width: 100%;
            max-width: 720px;
            background: rgba(255,255,255,0.92);
            border: 2px solid #457b9d;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.82rem;
            min-height: 48px;
            max-height: 72px;
            overflow-y: auto;
        }

        .log-line:last-child { font-weight: 700; color: #e63946; }
    </style>
</head>
<body>
    <header>
        <h1>🐸 Pond Life</h1>
        <div class="stats">
            <span class="stat">🐟 Fish: <span id="fishCount">0</span></span>
            <span class="stat">🐸 Frogs: <span id="frogCount">0</span></span>
            <span class="stat">🪲 Bugs: <span id="bugCount">0</span></span>
            <span class="stat">🌿 Plants: <span id="plantCount">0</span></span>
            <span class="stat">💧 Health: <span id="health">100</span>%</span>
            <span class="stat">⏱ Hour <span id="hour">6</span></span>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="section-title">Add to pond</div>
            <button class="spawn-btn selected" data-spawn="plant">🌿 Lily pad</button>
            <button class="spawn-btn" data-spawn="bug">🪲 Water bug</button>
            <button class="spawn-btn" data-spawn="fish">🐟 Minnow</button>
            <button class="spawn-btn" data-spawn="frog">🐸 Frog</button>

            <div class="section-title">Pond actions</div>
            <button class="action-btn" id="addRain">🌧 Make it rain</button>
            <button class="action-btn" id="addFood">🍞 Drop bug food</button>
            <button class="action-btn" id="clearPond">🧹 Clear pond</button>

            <div class="section-title">Sim speed</div>
            <button class="action-btn" id="speedBtn">Speed: 1× (click to change)</button>
        </aside>

        <div class="pond-wrap">
            <canvas id="pond" width="720" height="480"></canvas>
            <p class="hint">Click the pond to drop creatures. The sim runs by itself — populations grow, hunt, and die.</p>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
        const POND_W = 720;
        const POND_H = 480;
        const MAX_CREATURES = 80;

        // === CHANGE ME: species stats ===
        const SPECIES = {
            plant: { emoji: '🌿', speed: 0,   hunger: 0,  eat: null,  color: '#2d6a4f' },
            bug:   { emoji: '🪲', speed: 35,  hunger: 0.4, eat: null,  color: '#6a4c93' },
            fish:  { emoji: '🐟', speed: 55,  hunger: 0.6, eat: 'bug', color: '#0077b6' },
            frog:  { emoji: '🐸', speed: 28,  hunger: 0.5, eat: 'bug', color: '#40916c' }
        };

        const canvas = document.getElementById('pond');
        const ctx = canvas.getContext('2d');

        let creatures = [];
        let ripples = [];
        let raindrops = [];
        let spawnType = 'plant';
        let pondHealth = 100;
        let hour = 6;
        let tick = 0;
        let speed = 1;
        let logLines = ['Add some lily pads and bugs to start the food chain!'];

        function log(msg) {
            logLines.push(msg);
            if (logLines.length > 5) logLines.shift();
            document.getElementById('log').innerHTML = logLines.map(l => `<div class="log-line">${l}</div>`).join('');
        }

        function rand(min, max) { return min + Math.random() * (max - min); }

        function makeCreature(type, x, y) {
            const s = SPECIES[type];
            const angle = Math.random() * Math.PI * 2;
            return {
                type,
                x: x ?? rand(40, POND_W - 40),
                y: y ?? rand(40, POND_H - 40),
                vx: Math.cos(angle) * s.speed,
                vy: Math.sin(angle) * s.speed,
                hunger: rand(20, 60),
                age: 0,
                size: type === 'plant' ? rand(0.8, 1.2) : 1
            };
        }

        function countType(type) {
            return creatures.filter(c => c.type === type).length;
        }

        function updateStats() {
            document.getElementById('fishCount').textContent = countType('fish');
            document.getElementById('frogCount').textContent = countType('frog');
            document.getElementById('bugCount').textContent = countType('bug');
            document.getElementById('plantCount').textContent = countType('plant');
            document.getElementById('health').textContent = Math.round(pondHealth);
            document.getElementById('hour').textContent = Math.floor(hour) % 24;
        }

        function nearestPrey(hunter, preyType, range) {
            let best = null;
            let bestDist = range;
            for (const c of creatures) {
                if (c.type !== preyType) continue;
                const d = Math.hypot(c.x - hunter.x, c.y - hunter.y);
                if (d < bestDist) {
                    bestDist = d;
                    best = c;
                }
            }
            return best;
        }

        function removeCreature(c) {
            const i = creatures.indexOf(c);
            if (i >= 0) creatures.splice(i, 1);
        }

        function spawnRipple(x, y) {
            ripples.push({ x, y, r: 4, life: 1 });
        }

        function simStep(dt) {
            tick++;

            // day/night cycle (visual only affects water color)
            hour += dt * 0.4;
            if (hour >= 24) hour -= 24;

            // plants slowly spread bugs
            if (tick % 40 === 0 && countType('plant') > 0 && countType('bug') < 25 && creatures.length < MAX_CREATURES) {
                if (Math.random() < countType('plant') * 0.08) {
                    const p = creatures.find(c => c.type === 'plant');
                    if (p) {
                        creatures.push(makeCreature('bug', p.x + rand(-30, 30), p.y + rand(-30, 30)));
                        log('New bugs hatched on a lily pad!');
                    }
                }
            }

            for (const c of creatures) {
                c.age += dt;

                if (c.type === 'plant') continue;

                c.hunger += SPECIES[c.type].hunger * dt * 8;

                const preyType = SPECIES[c.type].eat;
                if (preyType && c.hunger > 35) {
                    const prey = nearestPrey(c, preyType, 70);
                    if (prey) {
                        const dx = prey.x - c.x;
                        const dy = prey.y - c.y;
                        const dist = Math.hypot(dx, dy) || 1;
                        c.vx += (dx / dist) * 120 * dt;
                        c.vy += (dy / dist) * 120 * dt;
                        if (dist < 18) {
                            removeCreature(prey);
                            c.hunger = Math.max(0, c.hunger - 45);
                            spawnRipple(c.x, c.y);
                        }
                    }
                }

                // wander
                c.vx += rand(-20, 20) * dt;
                c.vy += rand(-20, 20) * dt;
                const sp = Math.hypot(c.vx, c.vy);
                const maxSp = SPECIES[c.type].speed * 1.4;
                if (sp > maxSp) {
                    c.vx = (c.vx / sp) * maxSp;
                    c.vy = (c.vy / sp) * maxSp;
                }

                c.x += c.vx * dt;
                c.y += c.vy * dt;

                // pond edges
                const pad = 22;
                if (c.x < pad) { c.x = pad; c.vx *= -0.6; }
                if (c.x > POND_W - pad) { c.x = POND_W - pad; c.vx *= -0.6; }
                if (c.y < pad) { c.y = pad; c.vy *= -0.6; }
                if (c.y > POND_H - pad) { c.y = POND_H - pad; c.vy *= -0.6; }

                // starve
                if (c.hunger > 100) {
                    removeCreature(c);
                    pondHealth = Math.max(0, pondHealth - 2);
                    log('A ' + c.type + ' starved...');
                }

                // fish reproduce rarely
                if (c.type === 'fish' && c.hunger < 20 && c.age > 8 && Math.random() < 0.002 && creatures.length < MAX_CREATURES) {
                    creatures.push(makeCreature('fish', c.x + rand(-15, 15), c.y + rand(-15, 15)));
                    log('Fish had babies! 🐟');
                    c.age = 0;
                }
            }

            // ecosystem health
            const plants = countType('plant');
            const bugs = countType('bug');
            if (plants === 0) pondHealth = Math.max(0, pondHealth - dt * 2);
            else if (bugs > 0 && plants > 0) pondHealth = Math.min(100, pondHealth + dt * 0.5);
            if (bugs > 30) pondHealth = Math.max(0, pondHealth - dt * 0.8);

            // rain helps plants
            for (let i = raindrops.length - 1; i >= 0; i--) {
                const r = raindrops[i];
                r.y += r.speed * dt * 60;
                r.life -= dt;
                if (r.y > POND_H || r.life <= 0) raindrops.splice(i, 1);
            }

            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].r += 40 * dt;
                ripples[i].life -= dt * 1.2;
                if (ripples[i].life <= 0) ripples.splice(i, 1);
            }

            if (tick % 120 === 0 && creatures.length > 3) {
                log('Hour ' + (Math.floor(hour) % 24) + ' — ecosystem ticking...');
            }

            updateStats();
        }

        function drawPond() {
            const night = hour >= 20 || hour < 6;
            const sky = night ? '#264653' : '#48cae4';
            const deep = night ? '#1b3a4b' : '#0096c7';

            const grd = ctx.createLinearGradient(0, 0, 0, POND_H);
            grd.addColorStop(0, sky);
            grd.addColorStop(0.35, '#56cfe1');
            grd.addColorStop(1, deep);
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, POND_W, POND_H);

            // muddy bottom
            ctx.fillStyle = night ? 'rgba(45, 106, 79, 0.35)' : 'rgba(45, 106, 79, 0.25)';
            ctx.beginPath();
            ctx.ellipse(POND_W / 2, POND_H * 0.85, POND_W * 0.42, 60, 0, 0, Math.PI * 2);
            ctx.fill();

            for (const r of ripples) {
                ctx.strokeStyle = `rgba(255,255,255,${r.life * 0.4})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
                ctx.stroke();
            }

            for (const r of raindrops) {
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fillRect(r.x, r.y, 2, 8);
            }

            // sort plants behind movers
            const sorted = [...creatures].sort((a, b) => {
                if (a.type === 'plant' && b.type !== 'plant') return -1;
                if (b.type === 'plant' && a.type !== 'plant') return 1;
                return 0;
            });

            for (const c of sorted) {
                const bounce = c.type === 'plant' ? 0 : Math.sin(tick * 0.08 + c.age) * 2;
                ctx.font = (26 * c.size) + 'px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(SPECIES[c.type].emoji, c.x, c.y + bounce);

                if (c.type !== 'plant' && c.hunger > 60) {
                    ctx.fillStyle = 'rgba(230, 57, 70, 0.85)';
                    ctx.fillRect(c.x - 12, c.y - 22, 24 * (c.hunger / 100), 3);
                }
            }

            if (night) {
                ctx.fillStyle = 'rgba(10, 20, 40, 0.35)';
                ctx.fillRect(0, 0, POND_W, POND_H);
            }
        }

        let last = performance.now();
        function loop(now) {
            const dt = Math.min((now - last) / 1000, 0.05) * speed;
            last = now;
            for (let i = 0; i < 1; i++) simStep(dt);
            drawPond();
            requestAnimationFrame(loop);
        }

        canvas.addEventListener('click', (e) => {
            if (creatures.length >= MAX_CREATURES) {
                log('Pond is full! Clear it or wait for some to die.');
                return;
            }
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (POND_W / rect.width);
            const y = (e.clientY - rect.top) * (POND_H / rect.height);
            creatures.push(makeCreature(spawnType, x, y));
            spawnRipple(x, y);
            log('Added ' + spawnType + ' ' + SPECIES[spawnType].emoji);
            updateStats();
        });

        document.querySelectorAll('.spawn-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                spawnType = btn.dataset.spawn;
                document.querySelectorAll('.spawn-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            });
        });

        document.getElementById('addRain').addEventListener('click', () => {
            for (let i = 0; i < 40; i++) {
                raindrops.push({ x: rand(0, POND_W), y: rand(-100, 0), speed: rand(4, 8), life: 3 });
            }
            pondHealth = Math.min(100, pondHealth + 15);
            if (countType('plant') > 0 && Math.random() < 0.4 && creatures.length < MAX_CREATURES) {
                const p = creatures.find(c => c.type === 'plant');
                creatures.push(makeCreature('plant', p.x + rand(-40, 40), p.y + rand(-40, 40)));
                log('Rain helped a new lily pad grow!');
            } else {
                log('Rain refreshed the pond!');
            }
            updateStats();
        });

        document.getElementById('addFood').addEventListener('click', () => {
            for (let i = 0; i < 5 && creatures.length < MAX_CREATURES; i++) {
                creatures.push(makeCreature('bug', rand(60, POND_W - 60), rand(60, POND_H - 60)));
            }
            log('Dropped bug food — more bugs!');
            updateStats();
        });

        document.getElementById('clearPond').addEventListener('click', () => {
            creatures = [];
            pondHealth = 100;
            log('Pond cleared. Start fresh!');
            updateStats();
        });

        document.getElementById('speedBtn').addEventListener('click', () => {
            speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
            document.getElementById('speedBtn').textContent = 'Speed: ' + speed + '× (click to change)';
        });

        // starter ecosystem
        creatures.push(makeCreature('plant', 200, 280));
        creatures.push(makeCreature('plant', 320, 320));
        creatures.push(makeCreature('bug', 210, 270));
        creatures.push(makeCreature('bug', 330, 310));
        creatures.push(makeCreature('fish', 400, 200));

        updateStats();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
